<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ふたりの相性診断</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#fff5f7,#f4f1ff);color:#27232a}
.wrap{max-width:560px;margin:auto;padding:24px 18px 48px}.card{background:#fff;border-radius:24px;padding:26px;box-shadow:0 10px 35px #00000012}
h1{font-size:28px;margin:8px 0}h2{font-size:21px}p{line-height:1.7}button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:10px;font-size:16px;font-weight:700;background:#222;color:#fff;cursor:pointer}button.alt{background:#eee;color:#222}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:18px;margin:7px 0 12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.choice{padding:20px 10px;background:#f7f4ff;color:#332b4d;border:2px solid transparent}.choice.selected{border-color:#8d6bff;background:#eee9ff}.small{font-size:13px;color:#777}.code{font-size:32px;letter-spacing:8px;text-align:center;font-weight:800;padding:12px;background:#faf7ff;border-radius:14px}.bar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:18px 0}.bar i{display:block;height:100%;background:#8d6bff}.hide{display:none}.result{font-size:52px;text-align:center;font-weight:900}.pill{display:inline-block;padding:5px 10px;background:#f0edf8;border-radius:999px;font-size:12px}
</style></head>
<body><main class="wrap"><div class="card">
<div id="home"><div class="pill">2人用・全50問</div><h1>ふたりの相性診断</h1><p>別々のスマホから同じルームに入り、相手の回答を見ずに回答します。</p>
<input id="name" placeholder="あなたの名前"><button onclick="create()">ルームを作る</button><button class="alt" onclick="show('join')">ルームに参加する</button></div>
<div id="join" class="hide"><h2>ルームに参加</h2><input id="jname" placeholder="あなたの名前"><input id="codeIn" placeholder="6桁のルームコード" maxlength="6"><button onclick="join()">参加する</button><button class="alt" onclick="show('home')">戻る</button></div>
<div id="lobby" class="hide"><div class="pill">待機中</div><h2 id="lobbyTitle"></h2><p>相手にこのコードを送ってください。</p><div class="code" id="codeOut"></div><p id="status">相手の参加を待っています…</p><button id="startBtn" onclick="start()" class="hide">診断を開始</button></div>
<div id="quiz" class="hide"><div class="small" id="progress"></div><div class="bar"><i id="bar"></i></div><div class="pill" id="cat"></div><h2 id="q"></h2><div class="choices"><button class="choice" data-v="yes" onclick="answer('yes')">そう思う</button><button class="choice" data-v="no" onclick="answer('no')">そう思わない</button></div><p id="wait" class="small"></p></div>
<div id="result" class="hide"><div class="pill">診断結果</div><h1>ふたりの相性</h1><div class="result" id="score"></div><p id="resultText" style="text-align:center"></p><div id="cats"></div><button onclick="location.reload()">もう一度やる</button></div>
</div></main>
<script>
const QUESTIONS=[{"cat": "恋愛観", "text": "恋人とは、できるだけ何でも話したい"}, {"cat": "恋愛観", "text": "恋人とは毎日連絡を取りたい"}, {"cat": "恋愛観", "text": "恋人との時間は一人の時間より優先したい"}, {"cat": "恋愛観", "text": "好きなら多少の束縛は気にならない"}, {"cat": "恋愛観", "text": "記念日は大切にしたい"}, {"cat": "恋愛観", "text": "恋人には自分の弱いところも見せたい"}, {"cat": "恋愛観", "text": "喧嘩したらその日のうちに仲直りしたい"}, {"cat": "恋愛観", "text": "恋人からのサプライズは嬉しい"}, {"cat": "恋愛観", "text": "恋人とは親友のような関係が理想"}, {"cat": "恋愛観", "text": "愛情は言葉より行動で示すほうだ"}, {"cat": "生活観", "text": "休日は家でゆっくり過ごすほうが好き"}, {"cat": "生活観", "text": "部屋は多少散らかっていても気にならない"}, {"cat": "生活観", "text": "朝型の生活が理想だ"}, {"cat": "生活観", "text": "旅行は予定を細かく決めたい"}, {"cat": "生活観", "text": "食事はできるだけ一緒に食べたい"}, {"cat": "生活観", "text": "家事はきっちり分担したい"}, {"cat": "生活観", "text": "一人の時間は恋人がいても必要だ"}, {"cat": "生活観", "text": "住む場所は便利さより落ち着きを重視したい"}, {"cat": "生活観", "text": "家具やインテリアにはこだわりたい"}, {"cat": "生活観", "text": "休日に外出する予定がなくても平気だ"}, {"cat": "金銭感覚", "text": "恋人とのデートでは多少お金をかけても楽しみたい"}, {"cat": "金銭感覚", "text": "貯金はできるだけ多いほうが安心する"}, {"cat": "金銭感覚", "text": "欲しいものは多少高くても買うほうだ"}, {"cat": "金銭感覚", "text": "恋人とはお金のことをオープンに話したい"}, {"cat": "金銭感覚", "text": "旅行では宿泊先にお金をかけたい"}, {"cat": "金銭感覚", "text": "食費を節約してでも趣味にお金を使いたい"}, {"cat": "金銭感覚", "text": "割り勘より状況に応じて支払うほうが自然だ"}, {"cat": "金銭感覚", "text": "将来のための貯金を優先したい"}, {"cat": "金銭感覚", "text": "セールを見ると予定外でも買いたくなる"}, {"cat": "金銭感覚", "text": "お金より思い出を優先したい"}, {"cat": "結婚・将来", "text": "結婚するなら早めにしたい"}, {"cat": "結婚・将来", "text": "結婚後もそれぞれの趣味を大切にしたい"}, {"cat": "結婚・将来", "text": "子どもについては早めに話し合いたい"}, {"cat": "結婚・将来", "text": "将来は同じ地域に長く住みたい"}, {"cat": "結婚・将来", "text": "結婚後も仕事を続けたい"}, {"cat": "結婚・将来", "text": "家を買うなら早めに検討したい"}, {"cat": "結婚・将来", "text": "家族との付き合いは大切にしたい"}, {"cat": "結婚・将来", "text": "将来のことは具体的に計画したい"}, {"cat": "結婚・将来", "text": "結婚式は盛大にしたい"}, {"cat": "結婚・将来", "text": "恋人とは老後まで一緒に過ごしたい"}, {"cat": "性格・価値観", "text": "嫌なことがあっても比較的すぐ切り替えられる"}, {"cat": "性格・価値観", "text": "自分より相手の気持ちを優先することが多い"}, {"cat": "性格・価値観", "text": "大勢で過ごすより少人数で過ごすほうが好き"}, {"cat": "性格・価値観", "text": "新しいことには積極的に挑戦したい"}, {"cat": "性格・価値観", "text": "決めるときは直感を信じるほうだ"}, {"cat": "性格・価値観", "text": "相手と意見が違ってもすぐ否定しない"}, {"cat": "性格・価値観", "text": "約束やルールはきちんと守りたい"}, {"cat": "性格・価値観", "text": "褒められるとかなり嬉しい"}, {"cat": "性格・価値観", "text": "恋人とは価値観が違っていても尊重できる"}, {"cat": "性格・価値観", "text": "最後は一緒に笑っていられればいいと思う"}];
let peer,conn,isHost=false,myName='',otherName='',answers=[],otherAnswers=[],idx=0,myAnswer=null;
const $=id=>document.getElementById(id);
function show(id){['home','join','lobby','quiz','result'].forEach(x=>$(x).classList.toggle('hide',x!==id));}
function code(){return Math.floor(100000+Math.random()*900000).toString()}
function create(){
 myName=$('name').value.trim()||'Aさん';isHost=true;const c=code();
 peer=new Peer('compat-'+c);peer.on('open',()=>{show('lobby');$('codeOut').textContent=c;$('lobbyTitle').textContent=myName+'さん';});
 peer.on('connection',x=>{conn=x;conn.on('open',()=>{otherName='Bさん';$('status').textContent='相手が参加しました。';$('startBtn').classList.remove('hide');send({type:'hello',name:myName})});conn.on('data',receive)});peer.on('error',e=>alert('接続エラー：'+e.type));
}
function join(){
 myName=$('jname').value.trim()||'Bさん';const c=$('codeIn').value.trim();if(c.length!==6)return alert('6桁のコードを入力してください');
 peer=new Peer();peer.on('open',()=>{conn=peer.connect('compat-'+c);conn.on('open',()=>{show('lobby');$('lobbyTitle').textContent=myName+'さん';$('codeOut').textContent=c;conn.on('data',receive);send({type:'hello',name:myName})});conn.on('error',()=>alert('ルームが見つかりません。コードを確認してください。'))});
}
function send(x){if(conn&&conn.open)conn.send(x)}
function receive(m){
 if(m.type==='hello'){otherName=m.name;$('status').textContent='相手と接続しました。';if(isHost)$('startBtn').classList.remove('hide')}
 if(m.type==='start'){idx=0;answers=[];otherAnswers=[];renderQ()}
 if(m.type==='answer'){otherAnswers[m.i]=m.v;if(isHost&&answers[m.i]!==undefined){send({type:'next',i:m.i+1});idx=m.i+1;if(idx>=QUESTIONS.length){send({type:'finish',hostAnswers:answers});finish()}else renderQ()}}
 if(m.type==='next'){idx=m.i;if(idx>=QUESTIONS.length)finish();else renderQ()}
 if(m.type==='finish'){otherAnswers=m.hostAnswers||[];finish()}
}
function start(){send({type:'start'});idx=0;answers=[];otherAnswers=[];renderQ()}
function renderQ(){
 show('quiz');const x=QUESTIONS[idx];$('progress').textContent=(idx+1)+' / '+QUESTIONS.length;$('bar').style.width=((idx+1)/QUESTIONS.length*100)+'%';$('cat').textContent=x.cat;$('q').textContent=x.text;$('wait').textContent='';document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));myAnswer=null;
}
function answer(v){
 if(myAnswer)return;myAnswer=v;answers[idx]=v;document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',b.dataset.v===v));
 send({type:'answer',i:idx,v:v});$('wait').textContent='回答を送信しました。相手の回答を待っています…';
 if(!isHost){/* host advances both */} else if(otherAnswers[idx]!==undefined){send({type:'next',i:idx+1});idx++;if(idx>=QUESTIONS.length)finish();else renderQ()}
}
function finish(){
 const matches=[];for(let i=0;i<QUESTIONS.length;i++)matches[i]=(answers[i]===otherAnswers[i]);
 // If this client is guest, its answers may be local while otherAnswers is host answers.
 let n=matches.filter(Boolean).length;let pct=Math.round(n/QUESTIONS.length*100);$('score').textContent=pct+'%';
 $('resultText').textContent=pct>=80?'かなり共通点が多い2人です。':pct>=60?'似ている部分と違う部分のバランスがある2人です。':'違いが見つかりました。お互いを知るきっかけになりそうです。';
 const map={};QUESTIONS.forEach((q,i)=>{map[q.cat]??=[];map[q.cat].push(matches[i])});
 $('cats').innerHTML=Object.entries(map).map(([k,a])=>`<p><b>${k}</b>　${Math.round(a.filter(Boolean).length/a.length*100)}%</p>`).join('');show('result');
}
</script></body></html>
